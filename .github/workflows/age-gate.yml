name: Dependency Age Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-age:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Run age gate
        run: |
          script_path="$RUNNER_TEMP/check-age.js"

          if ! git show "${BASE_SHA}:.github/scripts/check-age.js" > "$script_path" 2>/dev/null; then
            cp .github/scripts/check-age.js "$script_path"
          fi

          node "$script_path"
        env:
          MIN_AGE_DAYS: 4
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
