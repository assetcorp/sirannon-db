name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: 22
            python-version: '3.11'
          - node-version: 24
            python-version: '3.14'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Setup Python ${{ matrix.python-version }} for the Python client
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Go for the Go client
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: packages/go/go.mod
          cache-dependency-path: |
            packages/go/go.sum
            packages/go/tests/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Build the streaming extension for this runner
        working-directory: packages/ts
        run: pnpm build:vfs

      - name: Build Sirannon's SQLite for this runner
        working-directory: packages/ts
        run: pnpm build:sqlite

      - name: Build the SQLCipher that expo-sqlite vendors, for the Expo tests
        working-directory: packages/ts
        run: pnpm build:expo-sqlcipher

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Assert browser entries carry no Node builtins
        run: pnpm check:bundle

      - name: Assert a consumer of the published types compiles
        run: pnpm check:types

      - name: Assert the published API is documented and its reports are current
        run: pnpm check:api

      - name: Assert openapi.json and asyncapi.json match the server's types
        run: pnpm nx run sirannon-ts:api-description

      - name: Assert the Python and Go clients match openapi.json and asyncapi.json
        run: pnpm nx run-many -t generate

      - name: Assert the generated operation references in the client tests are current
        run: |
          pnpm --dir packages/ts run client-operations:write
          drift="$(git status --porcelain -- packages/python packages/go)"
          if [ -n "$drift" ]; then
            echo "$drift"
            git diff -- packages/python packages/go
            exit 1
          fi

      - name: Test
        run: pnpm test
        env:
          SIRANNON_REQUIRE_STREAMING_EXTENSION: '1'
          SIRANNON_REQUIRE_SIRANNON_SQLITE: '1'
          SIRANNON_REQUIRE_EXPO_SQLCIPHER: '1'

  benchmarks-writeup:
    name: Benchmarks writeup drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check BENCHMARKS.md matches the latest recorded run
        run: python3 benchmarks/writeup/generate.py --check

  benchmarks-harness:
    name: Benchmarks harness tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the harness
        working-directory: benchmarks/server
        run: python3 -m pip install -e '.[dev]'

      - name: Run harness tests
        working-directory: benchmarks/server
        run: python3 -m pytest -q

  e2e:
    name: Replication E2E (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Build Sirannon's SQLite for this runner
        working-directory: packages/ts
        run: pnpm build:sqlite

      - name: Replication E2E
        run: pnpm nx run sirannon-ts:test:e2e
        env:
          SIRANNON_REQUIRE_SIRANNON_SQLITE: '1'

  large-backups:
    name: Backups past the pending byte page
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Build the streaming extension for this runner
        working-directory: packages/ts
        run: pnpm build:vfs

      - name: Copies larger than 1 GiB
        run: pnpm nx run sirannon-ts:test:large
        env:
          SIRANNON_REQUIRE_STREAMING_EXTENSION: '1'
