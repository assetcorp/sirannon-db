name: Failover

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: failover-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Decide whether this push changes more than a release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_only: ${{ steps.scope.outputs.release_only }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Compare the push with the commit before it
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node .github/scripts/ci-scope.js --release-only

  failover:
    name: Coordinator failover (Node 24), part ${{ matrix.part }} of 2
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.release_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Failover scenarios
        run: >-
          pnpm nx run sirannon-ts:test:failover --shard=${{ matrix.part }}/2
          --reporter=default --reporter=json --outputFile.json=failover-results.json

      - name: Refuse skipped scenarios
        working-directory: packages/ts
        run: >-
          node -e "const results = require('./failover-results.json');
          const skipped = results.numPendingTests + results.numTodoTests;
          if (skipped > 0) { console.error(skipped + ' failover scenarios were skipped'); process.exit(1) }"
