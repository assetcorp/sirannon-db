name: Failover

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: failover-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  failover:
    name: Coordinator failover (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Failover scenarios
        run: pnpm nx run sirannon-ts:test:failover --reporter=default --reporter=json --outputFile.json=failover-results.json

      - name: Refuse skipped scenarios
        working-directory: packages/ts
        run: >-
          node -e "const results = require('./failover-results.json');
          const skipped = results.numPendingTests + results.numTodoTests;
          if (skipped > 0) { console.error(skipped + ' failover scenarios were skipped'); process.exit(1) }"
