name: Publish next

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-next
  cancel-in-progress: false

jobs:
  publish-next:
    name: Prerelease under the next dist-tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Build
        run: pnpm nx run sirannon-ts:build

      - name: Assert the published API is documented and its reports are current
        run: pnpm nx run sirannon-ts:check:api

      - name: Test
        run: pnpm nx run sirannon-ts:test

      - name: Set the prerelease version
        working-directory: packages/ts
        run: |
          base=$(node -p "require('./package.json').version.split('-')[0]")
          npm pkg set "version=${base}-next.${{ github.run_number }}"

      - name: Publish
        working-directory: packages/ts
        run: npm publish --tag next --access public
        env:
          NPM_CONFIG_PROVENANCE: true
