name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump (major, minor, patch, or explicit like 1.2.3). Republishing ignores this value."
        required: true
        type: string
      dry-run:
        description: "Dry run (skip actual publish)"
        required: false
        type: boolean
        default: false
      republish:
        description: "Publish the version already committed on main, leaving its tag and changelog alone"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  VFS_TARGETS: darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64

jobs:
  changes:
    name: Decide whether this push changes more than a release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_only: ${{ steps.scope.outputs.release_only }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compare the push with the commit before it
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node .github/scripts/ci-scope.js --release-only

  release-proof:
    name: Find the suites that main has already passed on these inputs
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      proven: ${{ steps.lookup.outputs.proven }}
      ci_suites: ${{ steps.lookup.outputs.ci_suites }}
      failover: ${{ steps.lookup.outputs.failover }}
      vfs_platform_run: ${{ steps.lookup.outputs.vfs_platform_run }}
      sqlite_platform_run: ${{ steps.lookup.outputs.sqlite_platform_run }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Look up main's passing push runs on the same inputs
        id: lookup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/proven-suites.js --lookup

  extension:
    name: Streaming extension
    needs: [changes, release-proof]
    if: ${{ !cancelled() && needs.changes.outputs.release_only != 'true' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/streaming-extension.yml
    with:
      from-source: ${{ github.event_name == 'workflow_dispatch' }}
      reuse-checks-from-run: ${{ needs.release-proof.outputs.vfs_platform_run }}

  sqlite:
    name: Sirannon SQLite
    needs: [changes, release-proof]
    if: ${{ !cancelled() && needs.changes.outputs.release_only != 'true' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/sirannon-sqlite.yml
    with:
      from-source: ${{ github.event_name == 'workflow_dispatch' }}
      reuse-checks-from-run: ${{ needs.release-proof.outputs.sqlite_platform_run }}

  ci:
    name: CI
    needs: release-proof
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.release-proof.outputs.ci_suites != 'none' }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      suites: ${{ needs.release-proof.outputs.ci_suites }}

  failover:
    name: Failover
    needs: release-proof
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.release-proof.outputs.failover != 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/failover.yml

  plan:
    name: Decide whether this push earns a prerelease
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'push' && needs.changes.outputs.release_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.resolve.outputs.publish }}
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the prerelease version
        id: resolve
        run: node .github/scripts/resolve-prerelease.js

  prerelease:
    name: Prerelease under the next dist-tag
    needs: [plan, extension, sqlite]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.publish == 'true'
      && needs.extension.result == 'success' && needs.sqlite.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: publish-next
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Build
        run: pnpm nx run sirannon-ts:build

      - name: Assert the published API is documented and its reports are current
        run: pnpm nx run sirannon-ts:check:api

      - name: Test
        run: pnpm nx run sirannon-ts:test

      - name: Set the prerelease version
        working-directory: packages/ts
        run: npm pkg set "version=${{ needs.plan.outputs.version }}"

      - name: Download the compiled extensions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sirannon-vfs-*
          path: native/artifacts

      - name: Version and publish the platform packages
        run: node .github/scripts/publish-vfs-packages.js "${{ needs.plan.outputs.version }}" next
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Download the Sirannon SQLite builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sirannon-sqlite-*
          path: native/artifacts

      - name: Version and publish the Sirannon SQLite packages
        run: node .github/scripts/publish-sqlite-packages.js "${{ needs.plan.outputs.version }}" next
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Publish
        working-directory: packages/ts
        run: npm publish --tag next --access public
        env:
          NPM_CONFIG_PROVENANCE: true

  publish:
    name: Release & Publish
    needs: [release-proof, extension, sqlite, ci, failover]
    if: >-
      ${{ !cancelled() && github.event_name == 'workflow_dispatch'
      && needs.extension.result == 'success'
      && needs.sqlite.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.ci.result)
      && contains(fromJSON('["success","skipped"]'), needs.failover.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Require the tip of main
        if: ${{ !inputs.dry-run }}
        env:
          RELEASED_COMMIT: ${{ github.sha }}
          RELEASED_REF: ${{ github.ref }}
        run: |
          git fetch --quiet origin main
          tip="$(git rev-parse origin/main)"
          if [ "$RELEASED_REF" != 'refs/heads/main' ] || [ "$tip" != "$RELEASED_COMMIT" ]; then
            echo "A release publishes only the tip of main, which is $tip, and this run tested $RELEASED_COMMIT on $RELEASED_REF"
            exit 1
          fi

      - name: Download the binaries that this release built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sirannon-*
          path: ${{ runner.temp }}/release-binaries

      - name: Require every suite to have passed here or on main's same inputs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          NATIVE_ARTIFACTS: ${{ runner.temp }}/release-binaries
          REUSED_SUITES: ${{ needs.release-proof.outputs.proven }}
        run: node .github/scripts/proven-suites.js --gate

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Build
        run: pnpm nx run sirannon-ts:build

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release
        if: ${{ !inputs.republish }}
        run: pnpm nx release ${{ inputs.version }} ${{ inputs.dry-run && '--dry-run' || '' }} --skip-publish
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

      - name: Download the compiled extensions
        if: ${{ !inputs.dry-run }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sirannon-vfs-*
          path: native/artifacts

      - name: Version and publish the platform packages
        if: ${{ !inputs.dry-run }}
        run: node .github/scripts/publish-vfs-packages.js "$(node -p "require('./packages/ts/package.json').version")" latest
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Download the Sirannon SQLite builds
        if: ${{ !inputs.dry-run }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sirannon-sqlite-*
          path: native/artifacts

      - name: Version and publish the Sirannon SQLite packages
        if: ${{ !inputs.dry-run }}
        run: node .github/scripts/publish-sqlite-packages.js "$(node -p "require('./packages/ts/package.json').version")" latest
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Publish
        if: ${{ !inputs.dry-run }}
        working-directory: packages/ts
        run: npm publish --access public
        env:
          NPM_CONFIG_PROVENANCE: true
