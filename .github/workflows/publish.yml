name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump (major, minor, patch, or explicit like 1.2.3)"
        required: true
        type: string
      dry-run:
        description: "Dry run (skip actual publish)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

env:
  VFS_TARGETS: darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64

jobs:
  extension:
    name: Streaming extension
    uses: ./.github/workflows/streaming-extension.yml

  plan:
    name: Decide whether this push earns a prerelease
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.resolve.outputs.publish }}
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the prerelease version
        id: resolve
        run: node .github/scripts/resolve-prerelease.js

  prerelease:
    name: Prerelease under the next dist-tag
    needs: [plan, extension]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-next
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Build
        run: pnpm nx run sirannon-ts:build

      - name: Assert the published API is documented and its reports are current
        run: pnpm nx run sirannon-ts:check:api

      - name: Test
        run: pnpm nx run sirannon-ts:test

      - name: Set the prerelease version
        working-directory: packages/ts
        run: npm pkg set "version=${{ needs.plan.outputs.version }}"

      - name: Download the compiled extensions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sirannon-vfs-*
          path: native/artifacts

      - name: Version and publish the platform packages
        run: node .github/scripts/publish-vfs-packages.js "${{ needs.plan.outputs.version }}" next
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Publish
        working-directory: packages/ts
        run: npm publish --tag next --access public
        env:
          NPM_CONFIG_PROVENANCE: true

  publish:
    name: Release & Publish
    needs: extension
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Build
        run: pnpm nx run sirannon-ts:build

      - name: Test
        run: pnpm nx run sirannon-ts:test

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release
        run: pnpm nx release ${{ inputs.version }} ${{ inputs.dry-run && '--dry-run' || '' }} --skip-publish
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

      - name: Download the compiled extensions
        if: ${{ !inputs.dry-run }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sirannon-vfs-*
          path: native/artifacts

      - name: Version and publish the platform packages
        if: ${{ !inputs.dry-run }}
        run: node .github/scripts/publish-vfs-packages.js "$(node -p "require('./packages/ts/package.json').version")" latest
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: pnpm nx release publish --verbose
        env:
          NPM_CONFIG_PROVENANCE: true
