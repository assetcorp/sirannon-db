name: Replication Soak

on:
  workflow_dispatch:
    inputs:
      duration_ms:
        description: Soak test duration in milliseconds
        required: false
        default: '600000'
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: replication-soak-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  soak:
    name: Soak (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Replication soak
        env:
          SIRANNON_SOAK_DURATION_MS: ${{ inputs.duration_ms || '600000' }}
        run: pnpm nx run sirannon-ts:test:soak
