name: Sirannon SQLite

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      from-source:
        description: Build every binary from source and leave the cache alone, as a release does
        required: false
        type: boolean
        default: false
      reuse-checks-from-run:
        description: A push run of publish.yml on main that passed these platform checks on the same inputs, so that each binary that matches that run's byte for byte reuses its check
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  scope:
    name: Decide whether this change needs the Sirannon SQLite checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      - name: Compare the change with the paths that the Sirannon SQLite checks read
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/ci-scope.js --platform-checks sqlite

  build:
    name: Build ${{ matrix.target }}
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.run != 'false' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15
          - target: linux-x64
            runner: ubuntu-latest
            zig: true
          - target: linux-x64-musl
            runner: ubuntu-latest
            zig: true
          - target: linux-arm64
            runner: ubuntu-latest
            zig: true
          - target: linux-arm64-musl
            runner: ubuntu-latest
            zig: true
          - target: win32-x64
            runner: ubuntu-latest
            zig: true
          - target: win32-arm64
            runner: ubuntu-latest
            zig: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Setup Zig
        if: matrix.zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Restore or build Sirannon's SQLite
        uses: ./.github/actions/native-binary
        with:
          binary: sqlite
          target: ${{ matrix.target }}
          from-source: ${{ inputs.from-source == true }}

      - name: Upload the binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sirannon-sqlite-${{ matrix.target }}
          path: native/sqlite/out/${{ matrix.target }}/better_sqlite3.node
          if-no-files-found: error

  select:
    name: Choose the Sirannon SQLite checks that this run owes
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      artifacts: ${{ steps.select.outputs.artifacts }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the binaries that this run built
        if: inputs.reuse-checks-from-run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sirannon-sqlite-*
          path: ${{ runner.temp }}/built

      - name: Compare each binary with the one that main's passing run checked
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ inputs.reuse-checks-from-run }}
          LOCAL_ARTIFACTS: ${{ runner.temp }}/built
          CHECK_MATRIX: >-
            [
            {"target": "linux-x64", "runner": "ubuntu-latest", "uwebsockets": true, "artifact": "sirannon-sqlite-linux-x64"},
            {"target": "linux-arm64", "runner": "ubuntu-24.04-arm", "uwebsockets": true, "artifact": "sirannon-sqlite-linux-arm64"},
            {"target": "win32-x64", "runner": "windows-latest", "uwebsockets": true, "artifact": "sirannon-sqlite-win32-x64"},
            {"target": "win32-arm64", "runner": "windows-11-arm", "uwebsockets": false, "artifact": "sirannon-sqlite-win32-arm64"},
            {"target": "darwin-arm64", "runner": "macos-15", "uwebsockets": true, "artifact": "sirannon-sqlite-darwin-arm64"},
            {"target": "darwin-x64", "runner": "macos-15-intel", "uwebsockets": true, "artifact": "sirannon-sqlite-darwin-x64"},
            {"target": "linux-x64-musl", "artifact": "sirannon-sqlite-linux-x64-musl"},
            {"target": "linux-arm64-musl", "artifact": "sirannon-sqlite-linux-arm64-musl"}
            ]
        run: node .github/scripts/native-binary-match.js --select

  check:
    name: Check on ${{ matrix.target }}
    needs: select
    if: ${{ !cancelled() && needs.select.result == 'success' && contains(needs.select.outputs.matrix, '"runner"') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download the binary for this runner
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: native/sqlite/out/${{ matrix.target }}

      - name: Check the build
        working-directory: packages/ts
        run: pnpm check:sqlite

      - name: Check the build from a renamed Node executable
        if: runner.os == 'Windows'
        timeout-minutes: 5
        working-directory: packages/ts
        shell: pwsh
        run: |
          $renamedHost = Join-Path $env:RUNNER_TEMP 'renamed-host.exe'
          Copy-Item (Get-Command node).Source $renamedHost
          & $renamedHost ../../native/sqlite/check.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble @delali/sirannon-sqlite
        working-directory: packages/ts
        run: pnpm assemble:sqlite

      - name: Run the library suites that need Sirannon's SQLite
        working-directory: packages/ts
        run: >-
          pnpm vitest run src/__tests__/integration/row-counts
          src/__tests__/integration/encryption/encrypted-files.test.ts
          src/__tests__/integration/encryption/encrypted-backups.test.ts
          src/__tests__/integration/encryption/key-change.test.ts
          src/__tests__/integration/encryption/key-secrecy.test.ts
          src/__tests__/integration/encryption/key-change-continuity.test.ts
        env:
          SIRANNON_REQUIRE_SIRANNON_SQLITE: '1'

      - name: Run the server suites that need Sirannon's SQLite
        if: matrix.uwebsockets
        working-directory: packages/ts
        run: pnpm vitest run --config vitest.e2e.config.ts src/__tests__/e2e/metering
        env:
          SIRANNON_REQUIRE_SIRANNON_SQLITE: '1'

  check-musl-arm64:
    name: Check on linux-arm64-musl
    needs: select
    if: ${{ !cancelled() && needs.select.result == 'success' && contains(fromJSON(needs.select.outputs.artifacts), 'sirannon-sqlite-linux-arm64-musl') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download the musl binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sirannon-sqlite-linux-arm64-musl
          path: native/sqlite/out/linux-arm64-musl

      - name: Check the build on Alpine
        run: docker run --rm -v "$PWD:/work" -w /work/packages/ts node:24-alpine node ../../native/sqlite/check.mjs

  check-musl-x64:
    name: Check on linux-x64-musl
    needs: select
    if: ${{ !cancelled() && needs.select.result == 'success' && contains(fromJSON(needs.select.outputs.artifacts), 'sirannon-sqlite-linux-x64-musl') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: node:24-alpine

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download the musl binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sirannon-sqlite-linux-x64-musl
          path: native/sqlite/out/linux-x64-musl

      - name: Check the build
        working-directory: packages/ts
        run: pnpm check:sqlite

      - name: Assemble @delali/sirannon-sqlite
        working-directory: packages/ts
        run: pnpm assemble:sqlite

      - name: Run the library suites that need Sirannon's SQLite
        working-directory: packages/ts
        run: >-
          pnpm vitest run src/__tests__/integration/row-counts
          src/__tests__/integration/encryption/encrypted-files.test.ts
          src/__tests__/integration/encryption/encrypted-backups.test.ts
          src/__tests__/integration/encryption/key-change.test.ts
          src/__tests__/integration/encryption/key-secrecy.test.ts
          src/__tests__/integration/encryption/key-change-continuity.test.ts
        env:
          SIRANNON_REQUIRE_SIRANNON_SQLITE: '1'
