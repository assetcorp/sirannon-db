name: Sirannon SQLite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15
          - target: linux-x64
            runner: ubuntu-latest
            zig: true
          - target: linux-x64-musl
            runner: ubuntu-latest
            zig: true
          - target: linux-arm64
            runner: ubuntu-latest
            zig: true
          - target: linux-arm64-musl
            runner: ubuntu-latest
            zig: true
          - target: win32-x64
            runner: ubuntu-latest
            zig: true
          - target: win32-arm64
            runner: ubuntu-latest
            zig: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Setup Zig
        if: matrix.zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Build Sirannon's SQLite
        working-directory: packages/ts
        run: pnpm build:sqlite ${{ matrix.target }}

      - name: Upload the binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sirannon-sqlite-${{ matrix.target }}
          path: native/sqlite/out/${{ matrix.target }}/better_sqlite3.node
          if-no-files-found: error

  check:
    name: Check on ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: win32-x64
            runner: windows-latest
          - target: win32-arm64
            runner: windows-11-arm
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download the binary for this runner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sirannon-sqlite-${{ matrix.target }}
          path: native/sqlite/out/${{ matrix.target }}

      - name: Check the build
        working-directory: packages/ts
        run: pnpm check:sqlite

      - name: Check the build from a renamed Node executable
        if: runner.os == 'Windows'
        timeout-minutes: 5
        working-directory: packages/ts
        shell: pwsh
        run: |
          $renamedHost = Join-Path $env:RUNNER_TEMP 'renamed-host.exe'
          Copy-Item (Get-Command node).Source $renamedHost
          & $renamedHost ../../native/sqlite/check.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble @delali/sirannon-sqlite
        working-directory: packages/ts
        run: pnpm assemble:sqlite

      - name: Run the suites that need Sirannon's SQLite
        working-directory: packages/ts
        run: |
          pnpm vitest run src/__tests__/integration/row-counts
          pnpm vitest run --config vitest.e2e.config.ts src/__tests__/e2e/metering
        env:
          SIRANNON_REQUIRE_SIRANNON_SQLITE: '1'

  check-musl-arm64:
    name: Check on linux-arm64-musl
    needs: build
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download the musl binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sirannon-sqlite-linux-arm64-musl
          path: native/sqlite/out/linux-arm64-musl

      - name: Check the build on Alpine
        run: docker run --rm -v "$PWD:/work" -w /work/packages/ts node:24-alpine node ../../native/sqlite/check.mjs

  check-musl-x64:
    name: Check on linux-x64-musl
    needs: build
    runs-on: ubuntu-latest
    container: node:24-alpine

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download the musl binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sirannon-sqlite-linux-x64-musl
          path: native/sqlite/out/linux-x64-musl

      - name: Check the build
        working-directory: packages/ts
        run: pnpm check:sqlite

      - name: Assemble @delali/sirannon-sqlite
        working-directory: packages/ts
        run: pnpm assemble:sqlite

      - name: Run the suites that need Sirannon's SQLite
        working-directory: packages/ts
        run: |
          pnpm vitest run src/__tests__/integration/row-counts
          pnpm vitest run --config vitest.e2e.config.ts src/__tests__/e2e/metering
        env:
          SIRANNON_REQUIRE_SIRANNON_SQLITE: '1'
