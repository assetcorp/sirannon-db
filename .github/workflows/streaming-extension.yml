name: Streaming extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            output: native/npm/darwin-arm64
          - target: darwin-x64
            runner: macos-15
            output: native/npm/darwin-x64
          - target: linux-x64
            runner: ubuntu-latest
            output: native/npm/linux-x64
            zig: true
          - target: linux-x64-musl
            runner: ubuntu-latest
            output: native/npm/linux-x64/musl
            zig: true
          - target: linux-arm64
            runner: ubuntu-latest
            output: native/npm/linux-arm64
            zig: true
          - target: linux-arm64-musl
            runner: ubuntu-latest
            output: native/npm/linux-arm64/musl
            zig: true
          - target: win32-x64
            runner: ubuntu-latest
            output: native/npm/win32-x64
            zig: true
          - target: win32-arm64
            runner: ubuntu-latest
            output: native/npm/win32-arm64
            zig: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Zig
        if: matrix.zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Build the extension
        working-directory: packages/ts
        run: pnpm build:vfs ${{ matrix.target }}

      - name: Upload the binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sirannon-vfs-${{ matrix.target }}
          path: ${{ matrix.output }}/sirannonvfs.*
          if-no-files-found: error

  stream:
    name: Streamed backup on ${{ matrix.label }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            runner: ubuntu-latest
            artifact: sirannon-vfs-linux-x64
            output: native/npm/linux-x64
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            artifact: sirannon-vfs-linux-arm64
            output: native/npm/linux-arm64
          - label: win32-x64
            runner: windows-latest
            artifact: sirannon-vfs-win32-x64
            output: native/npm/win32-x64
          - label: win32-arm64
            runner: windows-11-arm
            artifact: sirannon-vfs-win32-arm64
            output: native/npm/win32-arm64
          - label: darwin-arm64
            runner: macos-15
            artifact: sirannon-vfs-darwin-arm64
            output: native/npm/darwin-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the binary for this runner
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}

      - name: Run the streamed backup suites
        working-directory: packages/ts
        run: pnpm vitest run src/core/__tests__/integration/streamed-backup

  musl:
    name: Streamed backup on linux-x64 musl
    needs: build
    runs-on: ubuntu-latest
    container: node:24-alpine

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the musl binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sirannon-vfs-linux-x64-musl
          path: native/npm/linux-x64/musl

      - name: Run the streamed backup suite on Node's own SQLite
        working-directory: packages/ts
        run: pnpm vitest run src/core/__tests__/integration/streamed-backup-node-sqlite
