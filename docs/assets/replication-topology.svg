<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 1250 800" role="img" aria-labelledby="title description" font-family="'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Sirannon coordinator-backed replication topology</title>
  <desc id="description">Application clients send writes to the primary and eligible reads and change subscriptions to any readable node. The primary replicates to replicas over gRPC with mutual TLS. A Sirannon controller uses leases and atomic term updates stored in etcd to promote an eligible replica. Nodes reject traffic from stale primary terms.</desc>
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#0d9488"/></marker>
    <style>
      .client-flow{fill:none;stroke:#64748b;stroke-width:2.5;stroke-linecap:round;marker-end:url(#arrow-slate)}
      .replication-flow{fill:none;stroke:#0d9488;stroke-width:2.5;stroke-linecap:round;marker-end:url(#arrow-teal)}
      .control-flow{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:7 6;stroke-linecap:round;marker-end:url(#arrow-slate)}
      .control-flow-both{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:7 6;stroke-linecap:round;marker-start:url(#arrow-slate);marker-end:url(#arrow-slate)}
      .label{fill:#475569;font-size:14px;font-weight:500}
      .node-title{font-size:18px;font-weight:600}
      .node-detail{font-size:13.5px}
    </style>
  </defs>
  <rect x="20" y="20" width="1250" height="800" fill="#ffffff"/>
  <text x="645" y="58" text-anchor="middle" font-size="24" font-weight="700" fill="#134e4a">Sirannon coordinator-backed replication</text>

  <rect x="495" y="90" width="300" height="74" rx="37" fill="#134e4a" stroke="#0f766e" stroke-width="2.5"/>
  <text x="645" y="134" text-anchor="middle" class="node-title" fill="#ffffff">Application clients</text>
  <path d="M645 164V292" class="client-flow"/>
  <path d="M570 155 235 292" class="client-flow"/>
  <path d="M720 155 1055 292" class="client-flow"/>
  <text x="654" y="222" class="label">writes</text>
  <text x="300" y="220" class="label">eligible reads + CDC</text>
  <text x="855" y="220" class="label">eligible reads + CDC</text>

  <rect x="60" y="248" width="1170" height="205" rx="18" fill="#f0fdfa" fill-opacity=".35" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="82" y="241" font-size="14" font-weight="600" fill="#64748b" letter-spacing=".4">REPLICATION GROUP</text>
  <path d="M520 350H335" class="replication-flow"/>
  <path d="M770 350H955" class="replication-flow"/>

  <path d="M520 307V395A125 15 0 0 0 770 395V307" fill="#0d9488" stroke="#0f766e" stroke-width="2.5"/>
  <ellipse cx="645" cy="307" rx="125" ry="15" fill="#0d9488" stroke="#0f766e" stroke-width="2.5"/>
  <text x="645" y="353" text-anchor="middle" class="node-title" fill="#ffffff">Current primary</text>
  <text x="645" y="375" text-anchor="middle" class="node-detail" fill="#ffffff" opacity=".92">accepts writes with live authority</text>

  <path d="M95 315V385A95 15 0 0 0 285 385V315" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2.5"/>
  <ellipse cx="190" cy="315" rx="95" ry="15" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2.5"/>
  <text x="190" y="360" text-anchor="middle" class="node-title" fill="#134e4a">Replica</text>
  <text x="190" y="381" text-anchor="middle" class="node-detail" fill="#475569">readable when eligible</text>

  <path d="M1005 315V385A95 15 0 0 0 1195 385V315" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2.5"/>
  <ellipse cx="1100" cy="315" rx="95" ry="15" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2.5"/>
  <text x="1100" y="360" text-anchor="middle" class="node-title" fill="#134e4a">Replica</text>
  <text x="1100" y="381" text-anchor="middle" class="node-detail" fill="#475569">readable when eligible</text>

  <rect x="220" y="520" width="850" height="205" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="242" y="513" font-size="14" font-weight="600" fill="#64748b" letter-spacing=".4">FAILOVER CONTROL PLANE</text>
  <path d="M505 570 615 453" class="control-flow"/>
  <text x="466" y="493" class="label">promotion decision</text>
  <path d="M875 453V557" class="control-flow-both"/>
  <text x="892" y="493" class="label">sessions + watches</text>

  <rect x="280" y="570" width="330" height="100" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
  <text x="445" y="610" text-anchor="middle" class="node-title" fill="#134e4a">Sirannon failover controller</text>
  <text x="445" y="635" text-anchor="middle" class="node-detail" fill="#475569">active on one node, standby on others</text>

  <path d="M730 575V650A130 15 0 0 0 990 650V575" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
  <ellipse cx="860" cy="575" rx="130" ry="15" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="860" y="615" text-anchor="middle" class="node-title" fill="#334155">etcd coordinator state</text>
  <text x="860" y="638" text-anchor="middle" class="node-detail" fill="#475569">leases, terms, primary, in-sync set</text>
  <path d="M610 620H730" class="control-flow-both"/>
  <text x="670" y="605" text-anchor="middle" class="node-detail" fill="#475569">lease + term CAS</text>

  <text x="645" y="767" text-anchor="middle" font-size="14" font-weight="600" fill="#b91c1c">On failure, the controller advances the term and promotes only an eligible in-sync replica.</text>
  <text x="645" y="790" text-anchor="middle" font-size="14" font-weight="600" fill="#b91c1c">Every node rejects writes and replication from stale terms.</text>

  <rect x="995" y="78" width="255" height="124" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="1011" y="105" font-size="13" font-weight="700" fill="#334155" letter-spacing=".4">LEGEND</text>
  <path d="M1011 130H1047" class="client-flow"/>
  <text x="1060" y="134" font-size="12.5" fill="#475569">HTTP / WebSocket</text>
  <path d="M1011 157H1047" class="replication-flow"/>
  <text x="1060" y="161" font-size="12.5" fill="#475569">gRPC + mTLS</text>
  <path d="M1011 184H1047" class="control-flow"/>
  <text x="1060" y="188" font-size="12.5" fill="#475569">Control-plane operation</text>
</svg>
