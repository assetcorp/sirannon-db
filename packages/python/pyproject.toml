[project]
name = "sirannon-client"
version = "0.1.0"
description = "Python client for the Sirannon database server, with a typed method for every HTTP route, change subscriptions that resume after a reconnection, live queries, and topology-aware routing."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Delali" }]
keywords = ["sirannon", "sqlite", "database", "change data capture", "live queries", "client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database :: Front-Ends",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "typing-extensions>=4.12",
    "websockets>=15,<18",
]

[project.urls]
Homepage = "https://sirannon.sondelali.com"
Documentation = "https://github.com/assetcorp/sirannon-db/blob/main/docs/python-client.md"
Repository = "https://github.com/assetcorp/sirannon-db"
Issues = "https://github.com/assetcorp/sirannon-db/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sirannon_client"]

[tool.hatch.build.targets.sdist]
include = ["src/sirannon_client", "README.md", "LICENSE"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "PERF", "PIE", "RUF", "S", "SIM", "UP", "W"]
ignore = ["RUF001", "RUF002", "S101", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["sirannon_client", "generator"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "generator", "tests", "scripts"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["sirannon_client._client", "sirannon_client._async_client"]
disable_error_code = ["override"]

[tool.pydantic-mypy]
init_forbid_extra = false
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
