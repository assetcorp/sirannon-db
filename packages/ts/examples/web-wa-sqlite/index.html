<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Field service - Sirannon device sync</title>
    <script>
      (() => {
        try {
          const choice = localStorage.getItem('sirannon-theme')
          const dark =
            choice === 'dark' ||
            (choice !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch {}
      })()
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="app-title">
        <h1>Field service</h1>
        <p id="device-label">Opening the local database...</p>
      </div>
      <div class="app-link">
        <span id="link-pill" class="pill pill-link-stopped">Disconnected</span>
        <button type="button" id="link-button">Come online</button>
        <fieldset id="theme-toggle"></fieldset>
      </div>
    </header>

    <main>
      <p id="banner" class="banner" hidden></p>
      <section id="status-strip" class="status-strip"></section>
      <p id="sync-error" class="sync-error" hidden></p>
      <section id="snapshot-panel" class="snapshot" hidden></section>

      <section class="panel">
        <h2>Work orders on this device</h2>
        <div id="order-list" class="order-list">
          <p class="empty">Opening the local work order list...</p>
        </div>
      </section>

      <section class="panel">
        <h2>Raise a work order</h2>
        <form id="new-order-form" class="new-order">
          <label for="new-order-site">Site</label>
          <input id="new-order-site" name="site" type="text" required maxlength="80" placeholder="Northgate substation" />
          <label for="new-order-task">Task</label>
          <input id="new-order-task" name="task" type="text" required maxlength="120" placeholder="Replace the isolation transformer" />
          <button type="submit">Add to this device</button>
        </form>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
