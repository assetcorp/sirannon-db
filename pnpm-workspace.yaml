packages:
  - packages/*
  - packages/ts
  - packages/ts/examples/*

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - grpc-tools
  - nx
  - protobufjs

minimumReleaseAge: 5760
minimumReleaseAgeExclude:
  - better-sqlite3@13.0.2

allowBuilds:
  better-sqlite3: true
  esbuild: true
  grpc-tools: true
  msw: false
  nx: true
  protobufjs: true
